name: Build and Package Minecraft Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository source code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Java Environment targeting JDK 25
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'maven'

    # Step 3: Compile and Package the JAR File using Maven
    # We pass the exact JAVA_HOME executable paths to override the compiler-plugin restriction.
    - name: Build with Maven
      run: |
        mvn clean package --file pom.xml \
          -Dmaven.compiler.fork=true \
          -Dmaven.compiler.executable="$JAVA_HOME/bin/javac"

    # Step 4: Upload the Compiled Artifact to GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ElementalSMP-Plugin
        path: target/*.jar
