name: SurvivalUtils
version: ${project.version}
main: com.survivalutils.SurvivalUtils
api-version: '1.21'
author: SurvivalUtilsTeam
description: Homes, TPA, combat tagging/anti-escape, a settings GUI, and editable server rules.

commands:
  sethome:
    description: Save a home at your current location.
    usage: /sethome [name]
  home:
    description: Teleport to one of your homes.
    usage: /home [name]
  delhome:
    description: Delete one of your homes.
    usage: /delhome [name]
  tpa:
    description: Request to teleport to another player.
    usage: /tpa <player>
  tpaccept:
    description: Accept an incoming teleport request.
    usage: /tpaccept
  tpdeny:
    description: Deny an incoming teleport request.
    usage: /tpdeny
  settings:
    description: Open your personal settings menu.
    usage: /settings
    aliases: [setting]
  spawn:
    description: Teleport to the world spawn.
    usage: /spawn
  rules:
    description: View the server rules.
    usage: /rules
  "/rules":
    description: Edit the server rules (OP only). Typed as //rules in chat.
    usage: "//rules <add|remove|clear|set> [text]"
    permission: survivalutils.rules.edit
    permission-message: You do not have permission to edit the rules.

permissions:
  survivalutils.rules.edit:
    description: Allows editing the server rules with //rules.
    default: op
