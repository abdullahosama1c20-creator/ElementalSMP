name: UtilityPvP
version: 1.0.0
main: com.example.utilitypvp.UtilityPvP
api-version: '26.2'
author: Example
website: https://github.com/yourname/utilitypvp
description: Player utilities and PvP combat management for Paper.
commands:
  sethome:
    description: Set a named home.
    usage: /sethome [name]
  home:
    description: Teleport to a named home.
    usage: /home [name]
  delhome:
    description: Delete a named home.
    usage: /delhome [name]
  tpa:
    description: Request to teleport to another player.
    usage: /tpa <player>
  tpaccept:
    description: Accept the latest incoming teleport request.
    usage: /tpaccept
  tpdeny:
    description: Deny the latest incoming teleport request.
    usage: /tpdeny
  spawn:
    description: Teleport to world spawn.
    usage: /spawn
  settings:
    description: Open your personal settings menu.
    usage: /settings
    aliases: [setting]
