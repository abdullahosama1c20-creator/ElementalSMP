# SurvivalUtils configuration
# Edit these values, then run /reload or restart the server to apply them.

homes:
  max-per-player: 10

teleport:
  # How long you must stand still (and take no damage) before /home, /tpa, or /spawn completes.
  warmup-seconds: 3

tpa:
  expiry-seconds: 30

duel:
  expiry-seconds: 30

combat:
  # How long a PvP hit tags both players for, blocking /home /tpa /spawn /duel etc.
  tag-duration-seconds: 15

afk:
  threshold-minutes: 3
